services:
  postgres:
    image: postgres:16-alpine
    container_name: forklifts_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: forklifts_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d forklifts_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: forklifts_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=forklifts_db;Username=postgres;Password=postgres"
    ports:
      - "8080:8080"

volumes:
  postgres_data: